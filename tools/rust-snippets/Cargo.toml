[package]
name = "rust-snippets"
version = "0.1.0"
edition = "2024"
publish = false
description = "Verifies every ```rust block in Principles of Robot Motion via Rust: syntax, type-check against the book's crate stack, and execution where self-contained."

[dependencies]
syn = { version = "2", features = ["full", "visit", "parsing", "printing", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# The harness is a separate package with the book's (heavy) crate stack; keep it out of this one.
[workspace]
