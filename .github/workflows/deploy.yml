name: Build and deploy the book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest build of a given ref matters. Keyed by ref rather than a
# single global group so a pull-request check can never cancel a deploy of main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages turns Pages on (with the Actions build type) the first
      # time this runs, and reads back where the site will be served from.
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      # A *project* site lives at https://<owner>.github.io/<repo>/, so the
      # export has to be built with that prefix baked into every asset URL.
      # This step reports it as `base_path` — and reports "/" instead once a
      # custom domain is attached, which next.config.mjs normalizes away.
      - id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          # Next.js 16 requires >= 20.9.
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # The numerical invariants behind every in-page simulation. If the
      # algorithm port drifts from the mathematics the book teaches, the build
      # fails here rather than shipping a widget that quietly lies.
      - name: Verify the algorithm library
        run: npm run check

      # Chapters present, widget ids matching their chapter, cross-references
      # resolving, citations carrying locators, internal links routed through
      # next/link so they survive the sub-path.
      - name: Verify book consistency
        run: npm run check:book

      # `next build` type-checks and statically exports every chapter.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
